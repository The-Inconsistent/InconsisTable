name: CI

# Actions minutes are scarce (a free plan, shared by the organisation's private repos), so a run happens only when it
# can tell us something:
# - not for a change that touches only documents;
# - not for a draft pull request (a stack is opened as drafts and checked locally; marking one ready runs it);
# - and a newer push to the same pull request, or to main, cancels the run of the older one, so merging a stack of
#   pull requests checks and publishes its last commit once instead of every commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The api's sign-in SDK lives in the private InconsisID repository (apps/api-go/go.mod).
  GOPRIVATE: github.com/The-Inconsistent

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U it" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          # The Go step is more than half of this job when it compiles from nothing; the module and build caches are
          # kept per go.sum.
          cache: true
          cache-dependency-path: apps/api-go/go.sum
      # The workflow's own token reads only this repository. The InconsisID reader app mints one that reads InconsisID
      # only, for an hour, and owes nothing to a person's account.
      - name: Mint a token that reads InconsisID
        id: inconsisid
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INCONSISID_APP_ID }}
          private-key: ${{ secrets.INCONSISID_APP_KEY }}
          owner: The-Inconsistent
          repositories: InconsisID
          permission-contents: read
      - name: Let git read InconsisID
        run: git config --global url."https://x-access-token:${{ steps.inconsisid.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - name: Go engine matches the TypeScript engine, and the Go tests
        env:
          TEST_DATABASE_URL: postgres://it:it@localhost:5435/go_test
        run: |
          PGPASSWORD=it psql -h localhost -p 5435 -U it -d it -c "CREATE DATABASE go_test"
          test -z "$(gofmt -l apps/api-go)" || { gofmt -l apps/api-go; exit 1; }
          (cd apps/api-go && go vet ./...)
          bun run test:go
      # End-to-end against the postgres service above, on the database no test has touched. The secrets are made per
      # run, so no repo secret is needed.
      - name: Generate test-only secrets
        run: |
          echo "ADMIN_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start the api
        working-directory: apps/api-go
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://it:it@localhost:5435/it
          WEB_ORIGIN: http://localhost:3000
          PORT: "4000"
          TRUST_CF: "1" # the smoke suite gives each socket its own cf-connecting-ip
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4000/api/health; then exit 0; fi
            sleep 1
          done
          echo "The api did not start"
          exit 1
      - name: Smoke tests
        env:
          DATABASE_URL: postgres://it:it@localhost:5435/it
        run: bun run test:smoke
      - name: Show the api log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  # The api and web images for the VPS stack (deploy/vps), pushed to GHCR only from main and only once check passed, so
  # no image of a failing commit exists. Pin the stack to a sha-<short> tag, never to main.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job can push packages, so every action is pinned to a commit, not a movable tag.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The api's build reads the private sign-in SDK (a Go module in InconsisID). The InconsisID reader app mints a
      # token that reads InconsisID only, for an hour, as in check above.
      - id: inconsisid
        if: matrix.image == 'api'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.INCONSISID_APP_ID }}
          private-key: ${{ secrets.INCONSISID_APP_KEY }}
          owner: The-Inconsistent
          repositories: InconsisID
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/the-inconsistent/inconsistable-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/${{ matrix.image }}.Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A BuildKit secret never lands in a layer (deploy/api.Containerfile). The web keeps its default API_ORIGIN,
          # http://api:4000, the compose service name.
          secrets: ${{ matrix.image == 'api' && format('inconsisid_token={0}', steps.inconsisid.outputs.token) || '' }}
          cache-from: type=gha,scope=ghcr-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.image }}

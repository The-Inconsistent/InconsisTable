name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U it" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Go engine matches the TypeScript engine
        run: |
          test -z "$(gofmt -l apps/api-go)" || { gofmt -l apps/api-go; exit 1; }
          (cd apps/api-go && go vet ./...)
          bun run test:go
      # End-to-end against the postgres service above. The secrets are made per run, so no repo secret is needed.
      - name: Generate test-only secrets
        run: |
          echo "ADMIN_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start the api
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://it:it@localhost:5435/it
          PORT: "4000"
          TRUST_CF: "1" # the smoke suite gives each socket its own cf-connecting-ip
        run: |
          nohup bun src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4000/api/lobby; then exit 0; fi
            sleep 1
          done
          echo "The api did not start"
          exit 1
      - name: Smoke tests
        env:
          DATABASE_URL: postgres://it:it@localhost:5435/it
        run: bun run test:smoke
      - name: Show the api log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

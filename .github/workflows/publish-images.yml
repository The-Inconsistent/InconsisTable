name: Publish images

# Builds the api and web images on every merge to main and pushes them to Artifact Registry, where Cloud Run pulls
# them (deploy/cloudrun). Google sign-in is Workload Identity Federation, so no key is stored here. Skipped until the
# repository variables exist (docs/deploy.md, "Cloud Run"): GCP_PROJECT, GCP_REGION, GCP_WIF_PROVIDER, GCP_PUSHER.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job can push images, so every action is pinned to a commit, not a movable tag.
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The api's build reads the private sign-in SDK (a Go module in InconsisID). The InconsisID reader app mints a
      # token that reads InconsisID only, for an hour, as in ci.yml.
      - id: inconsisid
        if: matrix.image == 'api'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.INCONSISID_APP_ID }}
          private-key: ${{ secrets.INCONSISID_APP_KEY }}
          owner: The-Inconsistent
          repositories: InconsisID
          permission-contents: read
      - id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSHER }}
          token_format: access_token
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/inconsis/inconsistable-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/${{ matrix.image }}.Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The web's rewrites are fixed at build time: on Cloud Run the api is its sidecar, on localhost.
          build-args: API_ORIGIN=http://localhost:4000
          # A BuildKit secret never lands in a layer (deploy/api.Containerfile).
          secrets: ${{ matrix.image == 'api' && format('inconsisid_token={0}', steps.inconsisid.outputs.token) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

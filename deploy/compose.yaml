# Run from the repo root:
#   cp deploy/api.env.example deploy/api.env; cp deploy/web.env.example deploy/web.env   (then fill them in)
#   NODE_AUTH_TOKEN=<token with read:packages> docker compose -f deploy/compose.yaml up -d --build   (or: podman compose)
# Only the web publishes a port. The api and Postgres stay on the compose network.
# There are no accounts yet: whoever reaches the port can make rooms and import into their own device user. So the port
# binds to this machine only; set BIND_ADDR to the LAN interface address (never 0.0.0.0, never a public one) to let
# phones at the table reach it. See docs/deploy.md.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: postgres.env
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/api.Containerfile, secrets: [npm_token] }
    restart: unless-stopped
    env_file: api.env
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        ["CMD", "bun", "-e", "const r = await fetch('http://localhost:4000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/web.Containerfile
      secrets: [npm_token]
    restart: unless-stopped
    env_file: web.env
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN

# Run from the repo root:
#   cp deploy/api.env.example deploy/api.env; cp deploy/web.env.example deploy/web.env   (then fill them in)
#   export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_...
#   docker compose -f deploy/compose.yaml up -d --build        (or: podman compose ...)
# Only the web publishes a port. The api and Postgres stay on the compose network.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: postgres.env
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/api.Containerfile }
    restart: unless-stopped
    env_file: api.env
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        ["CMD", "bun", "-e", "const r = await fetch('http://localhost:4000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/web.Containerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set the Clerk publishable key}
    restart: unless-stopped
    env_file: web.env
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:

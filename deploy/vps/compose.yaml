# The public VPS stack: InconsisTable (web, api), InconsisID (idp), Postgres 18 and Caddy. A Dockhand stack: Dockhand
# git-syncs this repo and runs `docker compose up -d` from here, so every app is a prebuilt image (never `build:`) and
# "Pull & redeploy" picks up a new tag. docs/deploy.md, "VPS", has the one-time host setup.
#
# Stack env (set in Dockhand; never committed):
#   TABLE_HOST, AUTH_HOST       the two public host names, e.g. table.example.com, auth.example.com
#   APP_TAG                     inconsistable-api/-web tag, sha-<short> from the publish-images workflow
#   IDP_TAG                     inconsisid image version
#   DATABASE_URL                postgres://it:<hex password>@postgres:5432/it (hex: a URL-safe password)
#   ADMIN_KEY                   optional; 32+ characters (openssl rand -hex 32)
#
# Secret files live on the host in /srv/inconsis/secrets (dir 0700 root, files 0444), bind-mounted one by one, so each
# container sees only its own. create_host_path: false makes a missing file fail the deploy instead of becoming a
# directory. Needs Docker Compose 2.23.1+ (inline configs).
name: inconsis

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    ports: ["80:80", "443:443", "443:443/udp"]
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [edge]
    depends_on: [web, idp]

  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: it
      POSTGRES_DB: it
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
      - {
          type: bind,
          source: /srv/inconsis/secrets/postgres_password,
          target: /run/secrets/postgres_password,
          read_only: true,
          bind: { create_host_path: false },
        }
      # InconsisID's role and database (its db/roles.sql), made on the first boot of an empty volume only.
      - {
          type: bind,
          source: /srv/inconsis/secrets/idp_db_password,
          target: /run/secrets/idp_db_password,
          read_only: true,
          bind: { create_host_path: false },
        }
    # Executable, so the entrypoint runs it rather than sourcing it into its own shell.
    configs: [{ source: init_it_auth, target: /docker-entrypoint-initdb.d/10-it-auth.sh, mode: 0555 }]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it -d it"]
      interval: 3s
      retries: 20
    networks: [data]

  api:
    image: ghcr.io/the-inconsistent/inconsistable-api:${APP_TAG:?set APP_TAG}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ADMIN_KEY: ${ADMIN_KEY:-}
      WEB_ORIGIN: https://${TABLE_HOST:?set TABLE_HOST}
      PORT: "4000"
      IDP_SIGN_IN: "1"
      IDP_ISSUER: https://${AUTH_HOST:?set AUTH_HOST}
      IDP_CLIENT_ID: inconsistable
      IDP_REDIRECT_URI: https://${TABLE_HOST}/api/auth/callback
      IDP_CLIENT_JWK_FILE: /run/secrets/idp_client_jwk.json
    volumes:
      - {
          type: bind,
          source: /srv/inconsis/secrets/idp_client_jwk.json,
          target: /run/secrets/idp_client_jwk.json,
          read_only: true,
          bind: { create_host_path: false },
        }
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        ["CMD", "bun", "-e", "const r = await fetch('http://localhost:4000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      start_period: 20s
      retries: 3
    # data: Postgres. edge: reaches https://${AUTH_HOST} (discovery, token exchange) out through the host.
    networks: [data, edge]

  web:
    image: ghcr.io/the-inconsistent/inconsistable-web:${APP_TAG}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      api: { condition: service_healthy }
    networks: [edge, data]

  idp:
    image: ghcr.io/the-inconsistent/inconsisid:${IDP_TAG:?set IDP_TAG}
    restart: unless-stopped
    # Hardening from InconsisID's deploy/README.md.
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ISSUER: https://${AUTH_HOST}
      # No password in the URL (db_password_in_env): it reads /run/secrets/db_password.
      DATABASE_URL: postgres://it_idp@postgres:5432/it_auth
      # Only Caddy reaches port 4100: the IdP believes the last X-Forwarded-For hop, which Caddy sets.
      BIND_PROXY_ONLY: "true"
    volumes:
      - {
          type: bind,
          source: /srv/inconsis/secrets/op_jwks.json,
          target: /run/secrets/op_jwks.json,
          read_only: true,
          bind: { create_host_path: false },
        }
      - {
          type: bind,
          source: /srv/inconsis/secrets/op_cookie_keys.json,
          target: /run/secrets/op_cookie_keys.json,
          read_only: true,
          bind: { create_host_path: false },
        }
      - {
          type: bind,
          source: /srv/inconsis/secrets/idp_db_password,
          target: /run/secrets/db_password,
          read_only: true,
          bind: { create_host_path: false },
        }
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, data]

configs:
  # Mirrors InconsisID's deploy/Caddyfile.example for the IdP; the table site adds the same timeouts. `$$` is a literal
  # `$` for compose.
  caddyfile:
    content: |
      {
      	servers {
      		timeouts {
      			read_header 10s
      			read_body 30s
      			write 60s
      			idle 2m
      		}
      	}
      }

      ${AUTH_HOST} {
      	encode zstd gzip
      	request_body {
      		max_size 64KB
      	}
      	header {
      		Strict-Transport-Security "max-age=63072000; includeSubDomains"
      		X-Content-Type-Options "nosniff"
      		Referrer-Policy "no-referrer"
      		X-Frame-Options "DENY"
      		Cross-Origin-Opener-Policy "same-origin"
      		Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(), microphone=(), geolocation=()"
      		-Server
      		-X-Powered-By
      	}
      	reverse_proxy idp:4100 {
      		header_up X-Forwarded-For {remote_host}
      		header_up X-Forwarded-Proto {scheme}
      		header_up X-Forwarded-Host {host}
      		header_up -Forwarded
      		transport http {
      			dial_timeout 5s
      			response_header_timeout 30s
      		}
      	}
      }

      ${TABLE_HOST} {
      	encode zstd gzip
      	header {
      		Strict-Transport-Security "max-age=63072000; includeSubDomains"
      		X-Content-Type-Options "nosniff"
      		-Server
      		-X-Powered-By
      	}
      	# The web proxies /api and /socket.io (websockets pass through reverse_proxy as they are) to the api.
      	reverse_proxy web:3000 {
      		header_up X-Forwarded-For {remote_host}
      	}
      }

  init_it_auth:
    content: |
      #!/bin/sh
      # InconsisID's db/roles.sql, run once by the Postgres entrypoint on an empty volume.
      set -eu
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d postgres -v idp_password="$$(cat /run/secrets/idp_db_password)" <<'SQL'
      SELECT format(
        'CREATE ROLE it_idp LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
        :'idp_password'
      )
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'it_idp')
      \gexec

      SELECT 'CREATE DATABASE it_auth OWNER it_idp'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'it_auth')
      \gexec

      REVOKE CONNECT, TEMPORARY ON DATABASE it_auth FROM PUBLIC;
      SQL

networks:
  edge:
  data:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
